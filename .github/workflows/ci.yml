name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buddy_test
        ports:
          - 7432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
      # For the tests that run two API instances together (test/cluster.test.ts).
      redis:
        image: valkey/valkey:8.1-alpine
        ports:
          - 7479:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:7432/buddy_test
      TEST_REDIS_URL: redis://localhost:7479/1
    steps:
      - uses: actions/checkout@v4
      # Bun installs and runs scripts; the tools and the API run on Node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      # Unused files, exports and dependencies.
      - run: bun run knip
      - run: bun run typecheck
      - run: bun run test

  # The web app in a phone-sized browser against a real API and database
  # (e2e/): sign-in, joining and chatting, hosting, waitlist, admin and more.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: imresamu/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 7432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install the browser
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      # Screenshots and traces of anything that failed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report/
            e2e/results/
          retention-days: 7
