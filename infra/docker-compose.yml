# Production: Postgres + PostGIS, the API, Caddy (routing + the landing page) and a
# Cloudflare Tunnel, on one VPS. Nothing publishes a port, so it shares a server
# with other apps without clashing over 80/443.
# Settings come from infra/.env (copy .env.example). From this folder:
#
#   docker compose up -d --build      # first start and every update
#   docker compose logs -f api
#
# See infra/README.md for the full server setup.
name: buddy-prod

services:
  db:
    image: imresamu/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
      POSTGRES_DB: buddy
    # No ports: Postgres is reachable only from the API on this network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buddy -d buddy']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    # CI deploys set API_IMAGE to the image it pushed to GHCR (see deploy.sh);
    # without it, `docker compose up -d --build` builds from this checkout.
    image: ${API_IMAGE:-buddy-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 7400
      DATABASE_URL: postgres://buddy:${DB_PASSWORD}@db:5432/buddy
      BETTER_AUTH_URL: https://api-buddy.${DOMAIN:?Set DOMAIN in infra/.env}
      # cloudflared then Caddy: the client is two hops from the right of X-Forwarded-For.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      # A folder, not the file: git pull replaces the file, and a single-file
      # mount would keep showing the old one.
      - ./caddy:/etc/caddy:ro
      - ../landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  # Connects out to Cloudflare, which sends both hostnames to caddy:80.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in infra/.env}
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
