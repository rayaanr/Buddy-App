# Local backend: Postgres + PostGIS and the API, both on Alpine images.
#
#   docker compose up -d --build           # API on :7400, Postgres on :7432
#   docker compose exec api node dist/seed.js
#   docker compose logs -f api             # sign-in codes are printed here
#
# Only the database (to run the API from source with `bun run api`):
#   docker compose up -d db
#
# Redis is only needed for the tests that run two API instances
# together (test/cluster.test.ts): docker compose up -d redis
#
# Overrides go in a .env file next to this one, e.g. API_URL=http://192.168.1.20:7400
# so a phone on your Wi-Fi can reach the API, or R2_* keys to try uploads.
name: buddy

services:
  db:
    image: imresamu/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buddy
    # Not 5432, so it doesn't clash with other local Postgres instances.
    ports: ['7432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs on first start only: creates buddy_test for the integration tests.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d buddy']
      interval: 5s
      timeout: 3s
      retries: 10

  # What several API instances share in production (see apps/api/src/lib/cluster.ts).
  redis:
    image: redis:7-alpine
    ports: ['7479:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports: ['7400:7400']
    environment:
      # Development mode: codes go to the log, no auth rate limits, seeding allowed.
      NODE_ENV: development
      PORT: 7400
      DATABASE_URL: postgres://postgres:postgres@db:5432/buddy
      BETTER_AUTH_URL: ${API_URL:-http://localhost:7400}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-do-not-use-in-production}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:7481}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional; empty means off.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Buddy <hello@example.com>}
      MODERATION_EMAIL: ${MODERATION_EMAIL:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    restart: unless-stopped

volumes:
  pgdata:
